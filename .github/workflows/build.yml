
# Build Quanta Voice and publish it where RunPod can actually pull it.
# QuantaCore Labs.
#
# WHY THIS EXISTS
# RunPod's GitHub integration builds this repo into
# `registry.runpod.net/source8833-quanta-voice-worker-main-dockerfile:<sha>`,
# and that image is bound to the endpoint the integration created. A endpoint
# created any other way accepts the image reference, returns HTTP 200, and then
# sits on `image pull: ... pending` forever - measured at eleven minutes with no
# progress and no error anywhere except the worker log.
#
# That mattered because the voice endpoint had to be REPLACED rather than
# edited: RunPod cannot change an endpoint's compute type, so the CPU endpoint
# could never become a GPU one, and the new endpoint could not pull the image.
#
# GHCR breaks the deadlock without a local Docker daemon, which was the whole
# point of building on RunPod in the first place.

name: build-and-push

on:
  push:
    branches: [main]
  workflow_dispatch:

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository }}

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write

    steps:
      - name: Check out
        uses: actions/checkout@v4

      # The CUDA base plus the baked-in Kokoro weights do not fit comfortably
      # beside everything a hosted runner ships with.
      - name: Reclaim disk space
        run: |
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc
          sudo rm -rf /usr/local/share/boost "$AGENT_TOOLSDIRECTORY"
          df -h /

      - name: Set up Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push
        uses: docker/build-push-action@v5
        with:
          context: .
          push: true
          tags: |
            ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:latest
            ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      # The image is useless to RunPod if it cannot be pulled anonymously, and
      # a private package fails in exactly the same silent way the RunPod
      # registry did. Say plainly which one this is.
      - name: Report the pull reference
        run: |
          echo "Pull with:  ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:latest"
          echo "If the package is PRIVATE, RunPod will hang on 'image pull: pending'."
          echo "Make it public: repo -> Packages -> quanta-voice-worker -> Package settings -> Change visibility."
